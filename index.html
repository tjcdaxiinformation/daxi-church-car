<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJC大溪教會 🚗 公務車快速回報</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            min-height: 100vh;
        }
        .active-btn {
            border-color: #f59e0b !important;
            background-color: #fef3c7 !important;
            color: #b45309 !important;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8">

    <!-- 設定與標題 -->
    <div class="w-full max-w-md flex justify-between items-center mb-4">
        <span class="text-xs text-amber-800 bg-amber-100 px-2 py-1 rounded-full font-semibold">TJC 大溪教會</span>
        <button id="configBtn" class="text-amber-700 hover:text-amber-900 focus:outline-none p-2" title="設定後台對接">
            <i class="fa-solid fa-gear text-xl"></i>
        </button>
    </div>

    <!-- 歡迎與卡片 -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-amber-100 p-6 relative">
        <!-- 頂部裝飾 -->
        <div class="text-center mb-6">
            <span class="text-4xl mb-2 block">⛪</span>
            <h1 class="text-2xl font-bold text-amber-900">公務車快速回報</h1>
            <p class="text-xs text-amber-600 mt-1">免登入 ‧ 一鍵相機拍照 ‧ 直接寫入試算表</p>
        </div>

        <!-- 提示 API 尚未設定 -->
        <div id="apiAlert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 text-center">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i> 尚未連接試算表後台！請點點右上角 <i class="fa-solid fa-gear"></i> 設定 API 網址。
        </div>

        <form id="carReportForm" class="space-y-5">
            <!-- 1. 回報類別 -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-2">1. 請問您今天是「出車」還是「歸還」？ <span class="text-red-500">*</span></label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" id="btnGo" onclick="selectType('出車到達')" class="flex flex-col items-center justify-center p-3 border-2 border-gray-200 rounded-2xl transition hover:border-amber-300 focus:outline-none bg-gray-50">
                        <span class="text-2xl mb-1">🚩</span>
                        <span class="text-sm font-bold text-gray-700">出車到達</span>
                    </button>
                    <button type="button" id="btnBack" onclick="selectType('回程歸還')" class="flex flex-col items-center justify-center p-3 border-2 border-gray-200 rounded-2xl transition hover:border-amber-300 focus:outline-none bg-gray-50">
                        <span class="text-2xl mb-1">🏁</span>
                        <span class="text-sm font-bold text-gray-700">回程歸還</span>
                    </button>
                </div>
            </div>

            <!-- 2. 駕駛員姓名 -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-2">2. 駕駛員姓名 <span class="text-red-500">*</span></label>
                <!-- 快捷按鈕 -->
                <div class="grid grid-cols-4 gap-2 mb-2">
                    <button type="button" onclick="selectDriver('楊忠生')" class="driver-badge py-2 px-1 border border-gray-200 rounded-xl text-xs font-semibold bg-gray-50 hover:bg-amber-50">楊忠生</button>
                    <button type="button" onclick="selectDriver('張弟兄')" class="driver-badge py-2 px-1 border border-gray-200 rounded-xl text-xs font-semibold bg-gray-50 hover:bg-amber-50">張弟兄</button>
                    <button type="button" onclick="selectDriver('李姊妹')" class="driver-badge py-2 px-1 border border-gray-200 rounded-xl text-xs font-semibold bg-gray-50 hover:bg-amber-50">李姊妹</button>
                    <button type="button" onclick="selectDriver('王傳道')" class="driver-badge py-2 px-1 border border-gray-200 rounded-xl text-xs font-semibold bg-gray-50 hover:bg-amber-50">王傳道</button>
                </div>
                <!-- 自訂輸入 -->
                <input type="text" id="driverInput" placeholder="或點擊上方快速選取/手動輸入姓名..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-400 focus:border-amber-400 focus:outline-none text-sm" required>
            </div>

            <!-- 3. 目前里程數 -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">3. 目前里程數 <span class="text-red-500">*</span></label>
                <div class="relative rounded-xl shadow-sm">
                    <input type="number" id="mileageInput" pattern="[0-9]*" inputmode="numeric" placeholder="請填寫儀表板上的里程數..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-400 focus:border-amber-400 focus:outline-none text-sm" required>
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                        <span class="text-gray-400 text-sm">km</span>
                    </div>
                </div>
            </div>

            <!-- 4. 里程表照片存證 -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-2">4. 里程表照片存證 <span class="text-red-500">*</span></label>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="previewImage(this)">
                
                <!-- 拍照點選區域 -->
                <div id="photoPlaceholder" onclick="triggerCamera()" class="w-full h-40 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col justify-center items-center cursor-pointer hover:border-amber-500 hover:bg-amber-50 transition">
                    <i class="fa-solid fa-camera text-4xl text-amber-600 mb-2"></i>
                    <span class="text-sm font-semibold text-amber-950">點擊拍照上傳里程表</span>
                    <span class="text-xs text-gray-400 mt-1">會直接開啟相機拍照</span>
                </div>

                <!-- 拍照後預覽畫面 -->
                <div id="photoPreviewContainer" class="hidden relative w-full h-48 bg-gray-100 rounded-2xl overflow-hidden border border-gray-200">
                    <img id="imagePreview" class="w-full h-full object-cover" src="" alt="預覽里程表照片">
                    <button type="button" onclick="clearPhoto()" class="absolute top-3 right-3 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg hover:bg-red-600 focus:outline-none">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                    <div class="absolute bottom-0 inset-x-0 bg-black bg-opacity-40 py-1 text-center text-white text-xs">
                        已自動壓縮照片，保證流暢上傳
                    </div>
                </div>
            </div>

            <!-- 5. 目的地 / 備註 -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">5. 目的地 / 備註 <span class="text-xs text-gray-400">(選填)</span></label>
                <input type="text" id="destinationInput" placeholder="例如：大溪教會、信徒探訪、總會..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-amber-400 focus:border-amber-400 focus:outline-none text-sm">
            </div>

            <!-- GPS 狀態顯示 -->
            <div class="flex items-center justify-between text-xs text-gray-400 px-1">
                <span id="gpsStatus"><i class="fa-solid fa-location-crosshairs mr-1"></i> 正在取得目前定位...</span>
                <span id="gpsCoords" class="font-mono text-[10px]"></span>
            </div>

            <!-- 提交按鈕 -->
            <button type="submit" id="submitBtn" class="w-full py-4 px-6 bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-2xl font-bold shadow-lg hover:from-amber-600 hover:to-amber-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>送出回報</span>
            </button>
        </form>
    </div>

    <!-- 頁尾宣告 -->
    <div class="mt-6 text-center text-xs text-amber-800 opacity-60">
        大溪教會公務車數位事工 © 2026
    </div>

    <!-- ===== 設定 API 網址的模態視窗 (Modal) ===== -->
    <div id="configModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-amber-100">
            <h3 class="text-lg font-bold text-amber-900 mb-2"><i class="fa-solid fa-link mr-1 text-amber-600"></i> 設定後台試算表網址</h3>
            <p class="text-xs text-gray-500 mb-4">請貼上您在 Google Apps Script 部署取得的「網頁應用程式網址 (結尾是 /exec)」：</p>
            <div class="space-y-4">
                <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-amber-400 focus:outline-none text-xs">
                <div class="flex gap-2">
                    <button onclick="saveConfig()" class="flex-1 py-2 px-4 bg-amber-500 text-white rounded-xl text-xs font-bold hover:bg-amber-600 transition">儲存設定</button>
                    <button onclick="toggleModal(false)" class="flex-1 py-2 px-4 bg-gray-100 text-gray-700 rounded-xl text-xs font-bold hover:bg-gray-200 transition">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 提交中遮罩 (Loading Screen) ===== -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-40 z-50 flex flex-col items-center justify-center text-white hidden">
        <div class="w-16 h-16 border-4 border-t-amber-500 border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin mb-4"></div>
        <p class="font-bold text-base">正在將里程數與照片寫入試算表...</p>
        <p class="text-xs text-gray-200 mt-1">請保持網路暢通，請勿關閉網頁</p>
    </div>

    <!-- ===== 「感謝主！」成功通知視窗 ===== -->
    <div id="thankYouModal" class="fixed inset-0 bg-amber-50 z-50 flex flex-col items-center justify-center text-center p-6 hidden">
        <div class="max-w-xs bg-white rounded-3xl p-8 border-2 border-amber-100 shadow-2xl relative">
            <span class="text-6xl mb-4 block animate-bounce">✨</span>
            <h2 class="text-2xl font-black text-amber-900 mb-3">感謝主！</h2>
            <p class="text-amber-800 text-sm leading-relaxed mb-6">
                願您今日所做的一切辛勞與擺上，皆蒙主親自紀念。<br>
                行程一路上都有神的看顧與平安！
            </p>
            <button onclick="closeThankYou()" class="w-full py-3 bg-amber-500 text-white font-bold rounded-2xl shadow-lg hover:bg-amber-600 transition">
                完成回報
            </button>
        </div>
    </div>

    <script>
        // 【網頁開發設定】如果您想要一次設定好，不再讓同工手動輸入，可以把 API 網址填在這裡：
        const HARDCODED_GAS_URL = "https://script.google.com/macros/s/AKfycbzz7-I33WaxciDwmLO1QHk0GXgHh2JcwXdTVOifgq6W5yQfDt2-tHC-mScXjbzDXok1/exec"; 

        let selectedType = "";
        let base64Photo = "";
        let gpsData = "無法取得GPS資料";

        // 頁面初始化
        window.onload = function() {
            // 自動偵測並取得 GPS 經緯度
            getGPSLocation();
            
            // 檢查 API 是否設定
            const currentUrl = getGasUrl();
            if (!currentUrl) {
                document.getElementById('apiAlert').classList.remove('hidden');
            }

            // 綁定表單提交
            document.getElementById('carReportForm').addEventListener('submit', function(e) {
                e.preventDefault();
                submitData();
            });

            // 綁定設定視窗按鈕
            document.getElementById('configBtn').onclick = function() {
                toggleModal(true);
            };
        }

        // 取得 API 網址
        function getGasUrl() {
            if (HARDCODED_GAS_URL) return HARDCODED_GAS_URL;
            return localStorage.getItem('gas_url');
        }

        // 控制 Modal 開關
        function toggleModal(show) {
            const modal = document.getElementById('configModal');
            const input = document.getElementById('gasUrlInput');
            if (show) {
                input.value = localStorage.getItem('gas_url') || "";
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        // 儲存設定
        function saveConfig() {
            const url = document.getElementById('gasUrlInput').value.trim();
            if (url) {
                localStorage.setItem('gas_url', url);
                document.getElementById('apiAlert').classList.add('hidden');
                toggleModal(false);
            } else {
                localStorage.removeItem('gas_url');
                document.getElementById('apiAlert').classList.remove('hidden');
                toggleModal(false);
            }
        }

        // 選擇 出車/歸還
        function selectType(type) {
            selectedType = type;
            const btnGo = document.getElementById('btnGo');
            const btnBack = document.getElementById('btnBack');
            const destInput = document.getElementById('destinationInput');

            if (type === '出車到達') {
                btnGo.classList.add('active-btn');
                btnBack.classList.remove('active-btn');
                if (!destInput.value) destInput.value = "";
            } else {
                btnBack.classList.add('active-btn');
                btnGo.classList.remove('active-btn');
                destInput.value = "大溪教會"; // 回程時自動貼心預填「大溪教會」
            }
        }

        // 選擇駕駛姓名快速標籤
        function selectDriver(name) {
            document.getElementById('driverInput').value = name;
            
            // 更新按鈕樣式
            const badges = document.querySelectorAll('.driver-badge');
            badges.forEach(badge => {
                if (badge.textContent === name) {
                    badge.classList.add('bg-amber-100', 'text-amber-800', 'border-amber-400');
                } else {
                    badge.classList.remove('bg-amber-100', 'text-amber-800', 'border-amber-400');
                }
            });
        }

        // 喚醒手機相機 / 檔案選取
        function triggerCamera() {
            document.getElementById('cameraInput').click();
        }

        // 處理照片預覽，並使用 canvas 自動高強度壓縮（避免 Base64 太大）
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();

                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        // 建立 Canvas 來壓縮圖片 (最寬限制為 800px)
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 800;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 壓縮為 jpeg，品質 0.7
                        base64Photo = canvas.toDataURL('image/jpeg', 0.7);
                        
                        // 顯示預覽
                        document.getElementById('imagePreview').src = base64Photo;
                        document.getElementById('photoPlaceholder').classList.add('hidden');
                        document.getElementById('photoPreviewContainer').classList.remove('hidden');
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        // 清除相片重新拍
        function clearPhoto() {
            document.getElementById('cameraInput').value = "";
            base64Photo = "";
            document.getElementById('photoPlaceholder').classList.remove('hidden');
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        }

        // 取得 GPS 座標
        function getGPSLocation() {
            const gpsStatus = document.getElementById('gpsStatus');
            const gpsCoords = document.getElementById('gpsCoords');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude.toFixed(6);
                        const lng = position.coords.longitude.toFixed(6);
                        gpsData = `${lat}, ${lng}`;
                        gpsStatus.innerHTML = `<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check"></i> GPS 定位已鎖定</span>`;
                        gpsCoords.textContent = gpsData;
                    },
                    function(error) {
                        gpsStatus.innerHTML = `<span class="text-amber-600"><i class="fa-solid fa-triangle-exclamation"></i> GPS定位未啟用</span>`;
                        gpsCoords.textContent = "無定位";
                        gpsData = "無GPS定位資料";
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                gpsStatus.innerHTML = `<span class="text-gray-400">裝置不支援GPS</span>`;
                gpsData = "裝置不支援GPS";
            }
        }

        // 表單資料一鍵提交至 Google Apps Script Web App
        function submitData() {
            const gasUrl = getGasUrl();
            if (!gasUrl) {
                alert("對不起，請先點擊右上角「齒輪 ⚙️」設定試算表後台的 API 網址！");
                toggleModal(true);
                return;
            }

            if (!selectedType) {
                alert("請點選【1. 請問您今天是「出車」還是「歸還」】！");
                return;
            }

            if (!base64Photo) {
                alert("請拍照上傳【4. 里程表照片】以利教會記錄核對！");
                return;
            }

            const driver = document.getElementById('driverInput').value.trim();
            const mileage = document.getElementById('mileageInput').value;
            const destination = document.getElementById('destinationInput').value.trim();

            // 顯示載入遮罩
            document.getElementById('loadingOverlay').classList.remove('hidden');

            const payload = {
                type: selectedType,
                driver: driver,
                mileage: mileage,
                photo: base64Photo,
                destination: destination,
                gps: gpsData
            };

            // 使用 fetch POST 發送 JSON 資料
            fetch(gasUrl, {
                method: "POST",
                mode: "no-cors", // 雲端硬碟防跨域最速模式
                cache: "no-cache",
                headers: {
                    "Content-Type": "text/plain" // 以純文字載體發送避免 CORS 阻擋
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                // 在 no-cors 模式下，雖然拿不到具體 JSON，但通常正常結束即代表成功
                document.getElementById('loadingOverlay').classList.add('hidden');
                // 彈出亮麗「感謝主」 modal
                document.getElementById('thankYouModal').classList.remove('hidden');
            })
            .catch(error => {
                document.getElementById('loadingOverlay').classList.add('hidden');
                alert("回報傳送失敗，請確認網路或聯絡資訊人員！錯誤：" + error);
            });
        }

        // 關閉成功感謝視窗並重置表單
        function closeThankYou() {
            document.getElementById('thankYouModal').classList.add('hidden');
            
            // 重置表單
            document.getElementById('carReportForm').reset();
            clearPhoto();
            selectedType = "";
            document.getElementById('btnGo').classList.remove('active-btn');
            document.getElementById('btnBack').classList.remove('active-btn');
            const badges = document.querySelectorAll('.driver-badge');
            badges.forEach(b => b.classList.remove('bg-amber-100', 'text-amber-800', 'border-amber-400'));
            getGPSLocation();
        }
    </script>
</body>
</html>
